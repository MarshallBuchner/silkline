<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Silkline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Full-bleed canvas stage; webcam under it; HUD pinned top and bottom. Deliberately single dark theme. */
:root{
  --bg:#07090c; --fg:#e8edf2; --muted:#93a0ad; --silk:#e4ecf3; --accent:#7fd3ff;
  --panel:rgba(12,16,22,.78); --line:rgba(223,232,240,.16);
  --display:"Chakra Petch",ui-monospace,Menlo,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.5;filter:saturate(.55) contrast(1.05)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.top{top:calc(16px + env(safe-area-inset-top,0px));align-items:center}
.bottom{bottom:calc(16px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:13px}
.status{font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.panel{pointer-events:auto;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.5;color:var(--muted);max-width:44ch;min-width:0}
.panel b{color:var(--fg);font-weight:500}
.actions{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}
button{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--silk);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
</style>

<video id="cam" playsinline muted hidden></video>
<canvas id="c" aria-label="Web shooter stage. Tap or drag to shoot."></canvas>

<div class="hud top">
  <div class="brand">SILKLINE</div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Touch mode</span></div>
</div>

<div class="hud bottom">
  <div class="panel" id="msg"><b>Swipe or tap anywhere to shoot.</b> Turn on the camera, point your index finger and flick it to fire a web the way you swipe.</div>
  <div class="actions">
    <button id="camBtn">Start camera</button>
    <button id="clearBtn" class="ghost">Clear</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const video = document.getElementById('cam');
  const msg = document.getElementById('msg'), dot = document.getElementById('dot'), statusText = document.getElementById('statusText');
  const camBtn = document.getElementById('camBtn');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- sound ----------
  let ac = null, noise = null;
  function audio() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noise = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  let lastSound = 0;
  function thwip() {
    if (!ac) return;
    const now = ac.currentTime;
    if (now - lastSound < 0.06) return; lastSound = now;
    const src = ac.createBufferSource(); src.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
    bp.frequency.setValueAtTime(4200, now); bp.frequency.exponentialRampToValueAtTime(700, now + 0.16);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.5, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    src.connect(bp).connect(g).connect(ac.destination); src.start(now); src.stop(now + 0.2);
  }

  // ---------- web physics ----------
  const shots = [], sparks = [];
  const rand = (a, b) => a + Math.random() * (b - a);

  function makeSplat(x, y, scale) {
    const spokes = Math.floor(rand(7, 11)), base = rand(0, Math.PI * 2), arms = [];
    for (let i = 0; i < spokes; i++) {
      const a = base + (i / spokes) * Math.PI * 2 + rand(-0.18, 0.18);
      arms.push({ a, len: rand(28, 70) * scale });
    }
    const rings = [];
    const nr = Math.floor(rand(3, 5));
    for (let r = 1; r <= nr; r++) {
      const f = r / (nr + 0.6);
      rings.push(arms.map(arm => ({ f: f * rand(0.85, 1.1), arm })));
    }
    return { x, y, arms, rings };
  }

  function fire(x, y, dx, dy, n, life) {
    const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const diag = Math.hypot(W, H);
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(dy, dx) + rand(-0.14, 0.14) * (n > 1 ? 1 : 0.3);
      const sp = rand(1500, 2100);
      shots.push({
        x0: x, y0: y, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        max: diag * rand(0.45, 0.9), state: 'fly', age: 0, stuckAge: 0,
        life: life || rand(3.2, 4.2), splat: null, wob: rand(0, 6)
      });
    }
    for (let i = 0; i < 10; i++) {
      const a = Math.atan2(dy, dx) + rand(-0.6, 0.6), s = rand(120, 420);
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.2, 0.45) });
    }
    thwip();
  }

  function update(dt) {
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i]; s.age += dt;
      if (s.state === 'fly') {
        s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt;
        const out = s.x < 0 || s.x > W || s.y < 0 || s.y > H;
        const far = Math.hypot(s.x - s.x0, s.y - s.y0) > s.max;
        if (out || far) {
          s.x = Math.max(0, Math.min(W, s.x)); s.y = Math.max(0, Math.min(H, s.y));
          s.state = 'stuck'; s.splat = makeSplat(s.x, s.y, out ? 1.25 : 0.9);
        }
      } else {
        s.stuckAge += dt;
        if (s.stuckAge > s.life) shots.splice(i, 1);
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9;
      if (p.t > p.life) sparks.splice(i, 1);
    }
  }

  function drawStrand(s, alpha) {
    const dx = s.x - s.x0, dy = s.y - s.y0, len = Math.hypot(dx, dy);
    const sag = s.state === 'stuck' ? Math.min(46, len * 0.07) * Math.min(1, s.stuckAge * 2.5) : 0;
    const mx = (s.x0 + s.x) / 2, my = (s.y0 + s.y) / 2 + sag;
    for (let k = 0; k < 3; k++) {
      const o = (k - 1) * 1.6, nx = -dy / (len || 1) * o, ny = dx / (len || 1) * o;
      ctx.strokeStyle = `rgba(232,240,247,${alpha * (k === 1 ? 0.95 : 0.35)})`;
      ctx.lineWidth = k === 1 ? 1.4 : 0.8;
      ctx.beginPath(); ctx.moveTo(s.x0 + nx * 0.2, s.y0 + ny * 0.2);
      ctx.quadraticCurveTo(mx + nx, my + ny, s.x + nx * 0.4, s.y + ny * 0.4); ctx.stroke();
    }
  }

  function drawSplat(s, alpha) {
    const sp = s.splat, grow = Math.min(1, s.stuckAge / 0.14);
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(232,240,247,${alpha * 0.85})`;
    ctx.beginPath();
    for (const arm of sp.arms) {
      ctx.moveTo(sp.x, sp.y);
      ctx.lineTo(sp.x + Math.cos(arm.a) * arm.len * grow, sp.y + Math.sin(arm.a) * arm.len * grow);
    }
    ctx.stroke();
    ctx.strokeStyle = `rgba(232,240,247,${alpha * 0.55})`;
    for (const ring of sp.rings) {
      ctx.beginPath();
      ring.forEach((p, i) => {
        const r = p.arm.len * p.f * grow;
        const x = sp.x + Math.cos(p.arm.a) * r, y = sp.y + Math.sin(p.arm.a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else {
          const prev = ring[i - 1], pr = prev.arm.len * prev.f * grow;
          const px = sp.x + Math.cos(prev.arm.a) * pr, py = sp.y + Math.sin(prev.arm.a) * pr;
          ctx.quadraticCurveTo((px + x) / 2 + (sp.x - (px + x) / 2) * 0.18, (py + y) / 2 + (sp.y - (py + y) / 2) * 0.18, x, y);
        }
      });
      const f = ring[0], fr = f.arm.len * f.f * grow, l = ring[ring.length - 1], lr = l.arm.len * l.f * grow;
      const fx = sp.x + Math.cos(f.arm.a) * fr, fy = sp.y + Math.sin(f.arm.a) * fr;
      const lx = sp.x + Math.cos(l.arm.a) * lr, ly = sp.y + Math.sin(l.arm.a) * lr;
      ctx.quadraticCurveTo((lx + fx) / 2 + (sp.x - (lx + fx) / 2) * 0.18, (ly + fy) / 2 + (sp.y - (ly + fy) / 2) * 0.18, fx, fy);
      ctx.stroke();
    }
  }

  const hands = []; // screen-space palm markers from tracking
  function draw() {
    if (camLive) ctx.clearRect(0, 0, W, H);
    else {
      ctx.fillStyle = '#07090c'; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W / 2, H * 0.9, 0, W / 2, H * 0.9, Math.max(W, H));
      g.addColorStop(0, 'rgba(127,211,255,0.07)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.lineCap = 'round';
    for (const s of shots) {
      const alpha = s.state === 'stuck' ? Math.max(0, Math.min(1, (s.life - s.stuckAge) / 0.9)) : 1;
      drawStrand(s, alpha);
      if (s.splat) drawSplat(s, alpha);
    }
    for (const p of sparks) {
      const a = 1 - p.t / p.life;
      ctx.fillStyle = `rgba(127,211,255,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    for (const h of hands) {
      ctx.strokeStyle = h.armed ? 'rgba(127,211,255,0.95)' : 'rgba(232,240,247,0.4)';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, h.armed ? 18 : 12, 0, Math.PI * 2); ctx.stroke();
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (camLive) detect(now);
    update(reduce ? dt * 0.6 : dt); draw();
    requestAnimationFrame(loop);
  }

  // ---------- touch / mouse ----------
  // Touch: swipe to fire from where your finger started, or tap to fire from the bottom toward the tap.
  let press = null;
  function origin() { return { x: W / 2, y: H + 10 }; }
  cv.addEventListener('pointerdown', e => { audio(); press = { x: e.clientX, y: e.clientY }; });
  addEventListener('pointerup', e => {
    if (!press) return;
    const dx = e.clientX - press.x, dy = e.clientY - press.y;
    if (Math.hypot(dx, dy) > 30) fire(press.x, press.y, dx, dy, 3);
    else { const o = origin(); fire(o.x, o.y, e.clientX - o.x, e.clientY - o.y, 3); }
    press = null;
  });
  addEventListener('pointercancel', () => { press = null; });
  document.getElementById('clearBtn').addEventListener('click', () => { shots.length = 0; sparks.length = 0; });

  // ---------- camera + hand tracking ----------
  let camLive = false, landmarker = null, lastVideoTime = -1;
  // Swipe tuning, in screen-lengths per second: fire above SWIPE_FIRE, re-arm once the finger slows below SWIPE_REARM.
  const SWIPE_FIRE = 2.0, SWIPE_REARM = 0.7, SWIPE_COOLDOWN = 450;
  const swipe = {};
  const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

  function setStatus(text, live) { statusText.textContent = text; dot.classList.toggle('live', !!live); }
  function say(html) { msg.innerHTML = html; }

  camBtn.addEventListener('click', async () => {
    audio();
    if (camLive) return;
    camBtn.disabled = true; setStatus('Starting camera');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream; video.hidden = false; await video.play();
    } catch (e) {
      camBtn.disabled = false; setStatus('Touch mode');
      say('<b>The camera is blocked here.</b> Allow camera access for this site in your browser settings, or open marshallbuchner.github.io/silkline. Touch mode still works.');
      return;
    }
    setStatus('Loading hand model');
    try {
      const vision = await import(MP + '/vision_bundle.mjs');
      const fs = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
      const opts = d => ({
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d },
        runningMode: 'VIDEO', numHands: 2
      });
      try { landmarker = await vision.HandLandmarker.createFromOptions(fs, opts('GPU')); }
      catch (g) { landmarker = await vision.HandLandmarker.createFromOptions(fs, opts('CPU')); }
    } catch (e) {
      setStatus('Camera only');
      say('<b>The hand model couldn’t load.</b> Check your connection and reload. Touch mode still works.');
      camBtn.disabled = false; return;
    }
    camLive = true; camBtn.textContent = 'Camera on'; setStatus('Tracking', true);
    say('<b>Point your index finger and flick it</b> to fire. The web flies the way you swipe. When the ring on your fingertip glows blue, you’re ready to fire again.');
  });

  function toScreen(lm) {
    const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
    const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
    return { x: ox + (1 - lm.x) * vw * s, y: oy + lm.y * vh * s };
  }
  const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function extended(l, tip, pip) { return d2(l[0], l[tip]) > d2(l[0], l[pip]) * 1.12; }

  function detect(now) {
    if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
    lastVideoTime = video.currentTime;
    let res; try { res = landmarker.detectForVideo(video, now); } catch (e) { return; }
    hands.length = 0;
    // Swipe to fire: a quick flick of the index fingertip shoots one volley in the flick's direction.
    const seen = new Set();
    (res.landmarks || []).forEach((l, i) => {
      const key = (res.handedness && res.handedness[i] && res.handedness[i][0] && res.handedness[i][0].categoryName) || ('h' + i);
      seen.add(key);
      const st = swipe[key] || (swipe[key] = { hist: [], ready: true, t: 0 });
      const tip = toScreen(l[8]);
      const pointing = extended(l, 8, 6);
      st.hist.push({ x: tip.x, y: tip.y, t: now });
      while (st.hist.length > 2 && now - st.hist[0].t > 110) st.hist.shift();
      const o = st.hist[0], dt = (now - o.t) / 1000;
      let sp = 0, vx = 0, vy = 0;
      if (dt > 0.035) { vx = (tip.x - o.x) / dt; vy = (tip.y - o.y) / dt; sp = Math.hypot(vx, vy) / Math.min(W, H); }
      if (!st.ready && sp < SWIPE_REARM) st.ready = true;
      if (st.ready && pointing && sp > SWIPE_FIRE && now - st.t > SWIPE_COOLDOWN) {
        fire(tip.x, tip.y, vx, vy, 3);
        st.ready = false; st.t = now; st.hist = [{ x: tip.x, y: tip.y, t: now }];
      }
      hands.push({ x: tip.x, y: tip.y, armed: st.ready && pointing && now - st.t > SWIPE_COOLDOWN });
    });
    for (const k in swipe) if (!seen.has(k)) delete swipe[k];
  }

  // opening volley so the first frame shows what this does
  [[0.22, 0.18], [0.78, 0.12], [0.55, 0.06]].forEach(([fx, fy], i) =>
    setTimeout(() => { const o = origin(); fire(o.x, o.y, W * fx - o.x, H * fy - o.y, 3, 7); }, 120 + i * 220));
  requestAnimationFrame(loop);
})();
</script>

</body></html>
